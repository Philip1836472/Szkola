<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kalkulator średniej ocen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Kalkulator średniej ocen</h1>

  <label for="grades">Wprowadź oceny (liczby całkowite od 1 do 6):</label>
  <textarea id="grades" placeholder="Np. 1, 3, 4, 6, 5"></textarea>

  <div class="controls">
    <button id="calcBtn">Oblicz średnią</button>
    <button id="clearBtn" type="button">Wyczyść</button>
  </div>

  <div id="output"></div>

  <script src="kalkulator.js"></script>
</body>
</html>
